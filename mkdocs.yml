site_name: Template de Entrega
site_author: Sandmann, H.
# troque para o SEU Pages
site_url: https://victorfariasoares.github.io/redes-neurais-e-deep-learning/

# troque para o SEU repo
repo_url: https://github.com/victorfariasoares/redes-neurais-e-deep-learning
repo_name: github/redes-neurais-e-deep-learning

theme:
  name: material
  palette:
    # primary: grey
    # Light mode
    - scheme: default
      primary: grey
      toggle:
        icon: material/toggle-switch-off-outline
        name: Switch to dark mode

    # Palette toggle for automatic mode
    - media: "(prefers-color-scheme)"
      primary: grey
      toggle:
        icon: material/toggle-switch
        name: Switch to light mode

    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default 
      primary: grey
      toggle:
        icon: material/toggle-switch-off-outline
        name: Switch to dark mode

    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      primary: grey
      scheme: slate
      toggle:
        icon: material/toggle-switch
        name: Switch to system preference
  features:
    - content.code.copy
    - content.code.select
    - content.code.annotate
    - content.tooltips
    - navigation.instant
    - navigation.instant.progress
    - navigation.top
    - navigation.path
    - navigation.tracking
    - navigation.expand
  icon:
    # logo: assets/images/devops
    admonition:
      note: fontawesome/solid/note-sticky
      abstract: fontawesome/solid/book
      info: fontawesome/solid/circle-info
      tip: fontawesome/solid/bullhorn
      success: fontawesome/solid/check
      question: fontawesome/solid/circle-question
      warning: fontawesome/solid/triangle-exclamation
      failure: fontawesome/solid/bomb
      danger: fontawesome/solid/skull
      bug: fontawesome/solid/robot
      example: fontawesome/solid/flask
      quote: fontawesome/solid/quote-left

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - markdown_grid_tables
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji 
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      url_download: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
        # - name: python
        #   class: python
        #   validator: !!python/name:markdown_exec.validator
        #   format: !!python/name:markdown_exec.formatter
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true  
  - footnotes
  - pymdownx.critic
  - pymdownx.caret
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.blocks.caption
  - tables
      
plugins:
  - glightbox
  - git-revision-date-localized:
      enable_creation_date: true
  - git-authors
  - git-committers:
      repository: hsandmann/hsandmann.github.com
      branch: main
  - search
  - badges
  - minify:
      minify_html: true
  # - markdown-exec
  - render_swagger:
      allow_arbitrary_locations : true
  # - termynal:
  #     prompt_literal_start:
  #       - "$"
  #       - ">"
  # ▲ ADIÇÃO: plugin para notebooks Jupyter
  - mkdocs-jupyter:
      execute: false
      ignore_h1_titles: true

extra_javascript:
  - https://unpkg.com/mathjax/es5/tex-mml-chtml.js
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
  - https://fastly.jsdelivr.net/npm/jquery/dist/jquery.min.js
  - https://fastly.jsdelivr.net/npm/echarts/dist/echarts.min.js

nav:
  - Home: index.md
  - This documentation: ./thisdocumentation/main.md
  - Roteiros:
    - Roteiro 1: ./roteiro1/main.md
    - Roteiro 2: ./roteiro2/main.md
    - Roteiro 3: ./roteiro3/main.md
    - Roteiro 4: ./roteiro4/main.md
  # ▲ ADIÇÃO: seus arquivos do Exercício 1 (notebook e markdown)
  - Exercícios:
    - Exercício 1 - Data: ./ex1_data/exs.md
    - Exercício 2 - Perceptron: ./ex2_perceptron/ex2.md
    - Exercício 3 - MLP: ./ex3_mlp/ex3.md
    - Exercício 4 - VAE: ./ex4_vae/ex4.md
  - Projeto 2 (Regression): ./projeto2/regression.md
  - Projeto 3 (Generative): ./projeto3/generative.md

# Passo a passo para subir um ex novo é:
# - abrir só a pasta do repositorio com a venv ativa
